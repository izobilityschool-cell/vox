
name: Render Olya and Kolya

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run render

      - name: Render preview frame
        run: npm run stills

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olja-kolja-video
          path: |
            out/*.mp4
            out/*.png
          retention-days: 14
